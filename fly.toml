app            = "macroverse42"
primary_region = "lhr"

[build]

[env]
  READONLY             = "true"
  DEMO_BANNER          = "true"
  DISABLE_EXTERNAL_LLM = "true"
  MACROVERSE_HOST_MODE   = "cloud"

[http_service]
  internal_port        = 8765
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0
  processes            = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "256mb"
  count    = 1
