<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VJ Output - Macroverse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { width: 100vw; height: 100vh; display: block; object-fit: contain; }
    #status {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #666; font-family: monospace; font-size: 14px; text-align: center;
      pointer-events: none; transition: opacity 0.4s;
    }
  </style>
</head>
<body>
  <canvas id="vjCanvas"></canvas>
  <div id="status">Waiting for VJ decks...</div>
  <script type="module" src="/src/vjOutputPage.ts"></script>
</body>
</html>
