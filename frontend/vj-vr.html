<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VJ VR - Macroverse</title>
  <link rel="stylesheet" href="/vj-vr.css">
</head>
<body>
  <div id="layout">
    <div id="previewWrap">
      <canvas id="vjCanvas"></canvas>
      <div id="roleBadge">VR</div>
      <div id="xrBadge">Checking WebXR…</div>
      <div id="status">Connecting...</div>
      <div id="interactHint">Touch or drag to steer shader mouse X/Y</div>
    </div>
    <div id="panel">
      <div class="vr-row">
        <button type="button" class="vr-btn vr-btn--primary" id="enterVr">Jump into VR</button>
        <button type="button" class="vr-btn" id="exitVr" hidden>Exit VR</button>
      </div>
      <div class="vr-row vr-mode-toggle">
        <label>View</label>
        <button type="button" class="vr-btn" id="modeDome">360 dome</button>
        <button type="button" class="vr-btn" id="modeScreen">Cinema screen</button>
        <span id="modeLabel" style="font-size:11px;color:var(--crt-dim)"></span>
      </div>
      <div id="controllerPanel" hidden>
        <div class="vr-section">Mix</div>
        <div class="vr-row">
          <label>Xfade</label>
          <input type="range" class="vr-field" id="xfade" min="0" max="1" step="0.001" value="0">
          <button type="button" class="vr-btn" id="xfadeA">A</button>
          <button type="button" class="vr-btn" id="xfadeB">B</button>
        </div>
        <div class="vr-row">
          <label>Mix</label>
          <select class="vr-field" id="mixMode">
            <option value="crossfade">Crossfade</option>
            <option value="add">Add</option>
            <option value="multiply">Multiply</option>
            <option value="difference">Difference</option>
            <option value="random">Random</option>
          </select>
        </div>
        <div class="vr-section">Decks</div>
        <div class="vr-row">
          <label>Deck A</label>
          <button type="button" class="vr-btn" id="deckAPrev">Prev</button>
          <button type="button" class="vr-btn" id="deckANext">Next</button>
          <span id="deckALabel" style="font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis"></span>
        </div>
        <div class="vr-row">
          <label>Deck B</label>
          <button type="button" class="vr-btn" id="deckBPrev">Prev</button>
          <button type="button" class="vr-btn" id="deckBNext">Next</button>
          <span id="deckBLabel" style="font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis"></span>
        </div>
        <div class="vr-section">Auto VJ</div>
        <div class="vr-row">
          <button type="button" class="vr-btn" id="autoVjBtn">Auto VJ Off</button>
          <label>BPM</label>
          <input type="number" class="vr-field" id="autoVjBpm" min="30" max="240" value="120" style="width:4.5em">
          <button type="button" class="vr-btn" id="autoVjTap">Tap</button>
        </div>
        <button type="button" class="vr-section-toggle" id="codeSectionToggle">Live code +</button>
        <div id="codeSectionBody">
          <div class="vr-row">
            <label>Deck</label>
            <select class="vr-field" id="codeDeck"><option value="A">A</option><option value="B">B</option></select>
            <input type="text" class="vr-field" id="codePath" placeholder="shader path" style="flex:1">
            <button type="button" class="vr-btn" id="codeLoad">Load</button>
          </div>
          <textarea id="codeEditor" class="vr-field" placeholder="GLSL source — edits push live to host output"></textarea>
          <div class="vr-row">
            <button type="button" class="vr-btn" id="codePush">Push live</button>
            <button type="button" class="vr-btn" id="codeSave">Save to server</button>
          </div>
        </div>
      </div>
      <div id="audiencePanel" hidden>
        <p class="vr-audience-copy">
          Audience view: live VJ mix from the host. Jump into VR to look around inside the shader dome.
          When the operator enables audience participation, touch or drag the preview to steer mouse X/Y.
        </p>
      </div>
    </div>
  </div>
  <div id="vrHud">
    <div class="vr-hud-row vr-hud-row--top">
      <button type="button" class="vr-btn" id="hudModeDome">360 dome</button>
      <button type="button" class="vr-btn" id="hudModeScreen">Cinema</button>
      <button type="button" class="vr-btn vr-btn--primary" id="hudExit">Exit VR</button>
    </div>
    <div class="vr-hud-row vj-only">
      <button type="button" class="vr-btn" id="hudDeckAPrev">Prev A</button>
      <span class="vr-hud-label" id="hudDeckALabel"></span>
      <button type="button" class="vr-btn" id="hudDeckANext">Next A</button>
    </div>
    <div class="vr-hud-row vj-only">
      <button type="button" class="vr-btn" id="hudDeckBPrev">Prev B</button>
      <span class="vr-hud-label" id="hudDeckBLabel"></span>
      <button type="button" class="vr-btn" id="hudDeckBNext">Next B</button>
    </div>
    <div class="vr-hud-row vj-only">
      <button type="button" class="vr-btn" id="hudXfadeA">A</button>
      <input type="range" class="vr-hud-range" id="hudXfade" min="0" max="1" step="0.001" value="0">
      <button type="button" class="vr-btn" id="hudXfadeB">B</button>
    </div>
    <div class="vr-hud-row vj-only">
      <select class="vr-field" id="hudMixMode">
        <option value="crossfade">Crossfade</option>
        <option value="add">Add</option>
        <option value="multiply">Multiply</option>
        <option value="difference">Difference</option>
        <option value="random">Random</option>
      </select>
      <button type="button" class="vr-btn" id="hudAutoVjBtn">Auto VJ Off</button>
      <input type="number" class="vr-field vr-hud-bpm" id="hudAutoVjBpm" min="30" max="240" value="120">
      <button type="button" class="vr-btn" id="hudAutoVjTap">Tap</button>
    </div>
  </div>
  <script type="module" src="/src/vjVrPage.ts"></script>
</body>
</html>
