# Nested dev.* hostnames: HTTP redirect to SSL-safe *-dev names (HTTPS still needs Total TLS or no DNS).
server {
  listen 80;
  server_name dev.macroverse.aday.net.au;
  return 301 https://macroverse-dev.aday.net.au$request_uri;
}

server {
  listen 80;
  server_name dev.artbastard.aday.net.au;
  return 301 https://artbastard-dev.aday.net.au$request_uri;
}

server {
  listen 80;
  server_name macroverse.aday.net.au;
  location /ws {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://macroverse_live:8765;
  }
  location / {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://macroverse_live:8765;
  }
}

server {
  listen 80;
  server_name
    macroverse-dev.aday.net.au
    macroverse-test.aday.net.au
    test.macroverse.aday.net.au
    dev.macroverse.aday.net.au;
  location /ws {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://macroverse_test:8765;
  }
  location / {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://macroverse_test:8765;
  }
}

# Private full-library lane — all paths require basic auth (including audience stream URLs).
server {
  listen 80;
  server_name macroverse-private.aday.net.au;

  location / {
    auth_basic "Macroverse private";
    auth_basic_user_file /etc/nginx/auth/aday.htpasswd;

    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://macroverse_aday:8765;
  }
}

# Retired hostname (aday.aday redundancy) — redirect to macroverse-private.
server {
  listen 80;
  server_name macroverse-aday.aday.net.au;
  return 301 https://macroverse-private.aday.net.au$request_uri;
}

server {
  listen 80;
  server_name artbastard.aday.net.au;
  location / {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://artbastard_live:3030;
  }
}

server {
  listen 80;
  server_name artbastard-beta.aday.net.au;
  return 301 https://artbastard-dev.aday.net.au$request_uri;
}

server {
  listen 80;
  server_name
    artbastard-dev.aday.net.au
    artbastard-test.aday.net.au
    test.artbastard.aday.net.au
    dev.artbastard.aday.net.au;
  location / {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://artbastard_test:3030;
  }
}