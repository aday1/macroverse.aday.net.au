server {
  listen 80;
  server_name macroverse.aday.net.au;
  location / {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://macroverse_live:8765;
  }
}

server {
  listen 80;
  server_name
    macroverse-test.aday.net.au
    test.macroverse.aday.net.au
    dev.macroverse.aday.net.au;
  location / {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://macroverse_test:8765;
  }
}

server {
  listen 80;
  server_name macroverse-aday.aday.net.au;

  auth_basic "Aday private";
  auth_basic_user_file /etc/nginx/auth/aday.htpasswd;

  location / {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://macroverse_aday:8765;
  }
}

